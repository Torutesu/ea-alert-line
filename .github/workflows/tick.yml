name: tick

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごと（UTC指定だが間隔なので影響なし）
  workflow_dispatch:

# 3ワークフローで同一グループを共有し、DBコミットの競合を防ぐ（直列実行）
concurrency:
  group: ea-alert-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tick
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN 未設定のためスキップ（Settings > Secrets で設定してください）"
            exit 0
          fi
          mkdir -p data
          python -m ea_alert.jobs.tick
      - name: Persist DB
        run: |
          git config user.name "ea-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ea_alert.db 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: 状態DB更新 (tick)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          git push
