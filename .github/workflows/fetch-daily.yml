name: fetch-daily

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 JST
  workflow_dispatch:

concurrency:
  group: ea-alert-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fetch_daily
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          mkdir -p data
          python -m ea_alert.jobs.fetch_daily
      - name: Persist DB
        # 送信・取得が失敗しても既読/送信済みの記録は残す
        # （残さないと次回実行が同じ通知を作り直して再送してしまう）
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ea-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ea_alert.db 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: 状態DB更新 (fetch_daily)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          git push
